{% extends "base.html" %}

{% block title %}Login{% endblock title %}

{% block content %}
<form method='POST' class='login_form'>
    {% csrf_token %}
    {{form.as_p}}
    <button type='submit' class='login_button'>login</button>
</form>

<p class='login_redirect_to_register_block'>
    <span>Don't have an account yet ?, </span>
    <span><a href="{% url "register" %}">register here</a></span>
</p>
{% endblock content %}
